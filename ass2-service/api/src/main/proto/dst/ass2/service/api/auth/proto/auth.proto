//service definition

syntax = "proto3";

package dst.ass2.service.api.auth.proto;

option java_package = "dst.ass2.service.api.auth.proto";

//generate separate files for each
option java_multiple_files = true;

message AuthenticationRequest {
  string email = 1;
  string password = 2;
}

// binary field 1 is authenticated, field 2 is token
message AuthenticationResponse {
  bool authenticated = 1;
  string token = 2;
}

message TokenValidationRequest {
  string token = 1;
}

message TokenValidationResponse {
  bool valid = 1;
}

// Defining the remote procedure calls
service AuthService {
  rpc authenticate(AuthenticationRequest) returns (AuthenticationResponse);
  rpc validateToken(TokenValidationRequest) returns (TokenValidationResponse);
}